# Local full-stack run: `docker compose up --build`, then open http://localhost:3000
# PostgreSQL and Redis join this file in Milestone 6 together with the first
# migrations (see docs/DATABASE.md) — adding idle services earlier buys nothing.
services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      LOG_LEVEL: info
      APP_VERSION: 0.1.0
    restart: unless-stopped
